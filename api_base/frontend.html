<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkpoint — Classificador de Imagens</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f5f7; margin:0; padding:40px; color:#222; }
    .container { max-width:850px; margin:0 auto; background:#fff; border-radius:16px; padding:32px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
    h1 { margin-top:0; }
    .box { margin-top:22px; padding:20px; border:1px solid #e5e7eb; border-radius:12px; }
    input[type=file] { display:block; margin:14px 0; }
    button { border:0; padding:12px 18px; border-radius:10px; background:#2563eb; color:#fff; font-weight:bold; cursor:pointer; }
    img { max-width:320px; max-height:260px; display:none; margin-top:18px; border-radius:12px; }
    pre { background:#111827; color:#e5e7eb; padding:16px; border-radius:10px; overflow-x:auto; min-height:90px; }
    .status { color:#6b7280; margin-top:12px; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Classificador de Imagens</h1>
    <p>Envie uma imagem para o endpoint <code>POST /predict</code>.</p>

    <div class="box">
      <input id="file" type="file" accept="image/*" />
      <button onclick="predict()">Classificar imagem</button>
      <div id="status" class="status">Aguardando imagem...</div>
      <img id="preview" alt="Prévia da imagem" />
    </div>

    <h2>Resposta da API</h2>
    <pre id="result">{}</pre>
  </main>

  <script>
    const fileInput = document.getElementById('file');
    const preview = document.getElementById('preview');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
    });

    async function predict() {
      const file = fileInput.files[0];
      if (!file) {
        statusEl.textContent = 'Selecione uma imagem.';
        return;
      }

      const formData = new FormData();
      formData.append('file', file);
      statusEl.textContent = 'Enviando imagem...';
      resultEl.textContent = '{}';

      try {
        const response = await fetch('/predict', { method: 'POST', body: formData });
        const data = await response.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
        statusEl.textContent = response.ok ? 'Predição concluída.' : 'A API retornou um erro.';
      } catch (error) {
        statusEl.textContent = 'Não foi possível conectar à API.';
        resultEl.textContent = String(error);
      }
    }
  </script>
</body>
</html>
